#cloud-config
package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - wget
  - jq
  - gnupg
  - lsb-release
  - software-properties-common
  - unzip
  - pciutils

runcmd:
  - mkdir -p /home/azureuser/faig-images
  - chown azureuser:azureuser /home/azureuser/faig-images
