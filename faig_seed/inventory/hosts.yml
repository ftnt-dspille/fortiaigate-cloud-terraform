---
# Inventory for the unified GPU server stack.
#
# Single host in group `k3s_node`. The same host runs the cluster, the ingress
# controller, the NFS provisioner, llama.cpp, and the chatbot.

all:
  children:
    k3s_node:
      hosts:
        gpu-server:
          ansible_host: <pod-ip>              # IP Ansible uses to SSH; may be DNAT'd
          ansible_user: fortinet
          # ansible_ssh_private_key_file: ~/.ssh/id_ed25519

      vars:
        # ---- Network ----
        primary_interface: ens3                    # Change for hosts with a different NIC
        external_address: <pod-ip>            # DNAT'd/public IP; leave empty for non-DNAT envs
        gpu_enabled: false
        # extra_tls_sans:
        #   - gpu.example.com

        # ---- cert-manager / Let's Encrypt (optional) ----
        # Set external_address to the FQDN and give the project/email to issue a
        # trusted cert via Cloud DNS (DNS-01). Requires the SA to hold dns.admin.
        # cert_manager_dns_project: my-gcp-project
        # cert_manager_email: admin@example.com
        # cert_manager_dns_zone: gpu.example.com

        # ---- GPU ----
        # Default false → CPU-only path; the gpu role is skipped entirely and
        # llamacpp runs the CPU image. Set true on a host with an NVIDIA GPU
        # to install the driver, NVIDIA Container Toolkit, and device plugin,
        # and to switch llamacpp to the CUDA image.
        # First-time driver install typically requires a reboot - the playbook
        # will fail with a clear message telling you to reboot and re-run.
        # gpu_enabled: true
        # nvidia_driver_branch: "550"              # see group_vars/all.yml

        # ---- Static /etc/hosts entries ----
        # Useful when image registries or other infra resolve only via /etc/hosts.
        extra_hosts:
          - ip: <pod-ip>
            name: registry.example.com   # e.g. your internal image registry

        # ============================================================================
        # llama.cpp tuning - host-level overrides
        # ============================================================================
        # All variables under this block are defined in group_vars/all.yml; any value
        # set here takes precedence (Ansible: host vars > group_vars/all). Uncomment
        # only the lines you need to change - leaving them commented inherits the
        # default. Run `ansible-playbook ... --tags llamacpp -v` to see the resolved
        # argv that's passed to llama-server.

        # ---- Model selection ----
        # llamacpp_model_url:  "https://huggingface.co/.../model-Q4_K_M.gguf"
        # llamacpp_model_alias: "llama3.2:3b"    # what OpenAI clients send as `model`

        # ---- Throughput / latency ----
        # llamacpp_ctx_size:      8192           # total context across all slots
        llamacpp_ctx_size: 65536
        # llamacpp_parallel:      2              # concurrent slots; ctx_size / parallel per slot
        llamacpp_parallel: 1
        # llamacpp_threads:       8              # physical cores, not SMT siblings
        # llamacpp_threads_batch: 8              # threads during prompt processing
        # llamacpp_batch_size:    1024           # logical batch (prompt eval throughput)
        # llamacpp_ubatch_size:   512            # physical batch (caps peak RAM)
        llamacpp_batch_size: 2048
        # llamacpp_n_predict:     512            # server-side cap when client omits max_tokens
        # llamacpp_cont_batching: true           # set false → --no-cont-batching
        # llamacpp_cache_reuse:   0              # >0 enables prefix-cache reuse across requests

        # ---- Memory / paging ----
        # llamacpp_mmap:          true           # set false → --no-mmap
        # llamacpp_mlock:         true           # pin weights in RAM
        # llamacpp_warmup:        true           # set false → --no-warmup
        # llamacpp_numa:          ""             # "" | "distribute" | "isolate" | "numactl"
        # llamacpp_defrag_thold:  ""             # float 0.0-1.0; lower = more aggressive defrag

        # ---- Attention / KV cache ----
        # llamacpp_flash_attn:        "on"       # "on" | "off" | "auto" - must be quoted
        # llamacpp_kv_cache_type_k:   q8_0       # f16 | q8_0 | q5_0 | q5_1 | q4_0 | q4_1
        # llamacpp_kv_cache_type_v:   q8_0       # requires flash_attn != off when quantized

        # ---- GPU (only emitted when gpu_enabled) ----
        # llamacpp_n_gpu_layers:  999            # 999 = offload all layers
        # llamacpp_main_gpu:      "0"            # multi-GPU: which GPU holds non-split tensors
        # llamacpp_tensor_split:  "3,1"          # multi-GPU: weight ratios (e.g. 75/25 across 2)
        # llamacpp_split_mode:    "layer"        # "none" | "layer" | "row"

        # ---- Long-context (rope scaling) ----
        # Only set when the model needs different scaling than its GGUF metadata.
        # llamacpp_rope_freq_base:  ""
        # llamacpp_rope_freq_scale: ""

        # ---- Chat template ----
        # llamacpp_chat_template: ""             # e.g. "chatml" or absolute path in container
        # llamacpp_jinja:         false          # required for some recent templates
        llamacpp_jinja: true

        # ---- Logging ----
        # llamacpp_log_format:  ""               # "" | "text" | "json"
        # llamacpp_verbose:     false

        # ---- Escape hatch ----
        # Any flag not modeled above. Items are appended verbatim to the argv.
        # llamacpp_extra_args:
        #   - "--no-display-prompt"
        #   - "--slot-save-path"
        #   - "/models/slots"

        # ---- Pod resource limits (k8s scheduler) ----
        # Make sure limits.cpu >= llamacpp_threads - the role warns otherwise.
        llamacpp_resources:
          requests: { cpu: "1",  memory: "4Gi" }
          limits:   { cpu: "12", memory: "8Gi" }

        # ---- API key (Bearer auth on /v1/*) ----
        # Prefer the LLAMACPP_API_KEY env var on the controller; this is here for
        # cases where you'd rather pin it in inventory.
        # llamacpp_api_key: "{{ lookup('env', 'LLAMACPP_API_KEY') | default('', true) }}"
